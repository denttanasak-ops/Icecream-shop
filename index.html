<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ร้านไอศกรีมแสนสนุก 🍦</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:linear-gradient(155deg,#fff0f6,#e7f8ff);color:#503951;min-height:100vh}main{max-width:680px;margin:auto;padding:18px 14px 40px}h1{text-align:center;font-size:clamp(25px,6vw,38px);margin:10px 0}.sub{text-align:center;margin:0 0 16px}.panel{background:#fff;border:3px solid #ffd2e5;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 5px 0 #f5c4da}.stats{display:flex;justify-content:space-around;text-align:center;gap:8px}.stats strong{display:block;font-size:25px;color:#e95b99}.customer{text-align:center}.face{font-size:64px;line-height:1.3}.order{font-size:19px;font-weight:700;background:#fff5c9;border-radius:14px;padding:10px}.preview{font-size:68px;text-align:center;min-height:100px;padding:5px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choices button,button.action{border:0;border-radius:14px;padding:13px 8px;background:#f9e1ef;font-size:17px;font-weight:700;color:#633d55;cursor:pointer;touch-action:manipulation}.choices button.selected{background:#ff8bb8;color:#fff;outline:3px solid #c84c86}.choices button:active,button.action:active{transform:scale(.97)}.action{width:100%;background:#ff6fa7!important;color:white!important;font-size:22px!important;margin-top:12px}.action.secondary{background:#85c9d9!important}.message{text-align:center;min-height:28px;font-weight:700}.small{font-size:13px;color:#85677b;text-align:center}h2{font-size:19px;margin:10px 0}.hidden{display:none}#start{margin-top:12px}#end{text-align:center}</style></head>
<body><main><h1>🍦 ร้านไอศกรีมแสนสนุก</h1><p class="sub">รับออร์เดอร์ ตักไอศกรีม และเก็บเหรียญ!</p>
<section class="panel stats"><div>เหรียญ<strong id="coins">0 🪙</strong></div><div>เสิร์ฟแล้ว<strong id="served">0</strong></div><div>เวลา<strong id="time">90</strong></div></section>
<section id="start" class="panel customer"><div class="face">🏪🍨</div><h2>พร้อมเปิดร้านหรือยัง?</h2><p>เลือกชนิดไอศกรีมและท็อปปิงให้ตรงกับที่ลูกค้าสั่ง ภายใน 90 วินาที!</p><button class="action" onclick="startGame()">เปิดร้านเลย ▶</button></section>
<div id="play" class="hidden"><section class="panel customer"><div class="face" id="face">👧</div><div class="order" id="order"></div></section>
<section class="panel"><h2>1. เลือกรสชาติ</h2><div class="choices" id="flavors"></div><h2>2. เลือกท็อปปิง</h2><div class="choices" id="toppings"></div><div class="preview" id="preview">🍦</div><button class="action" onclick="serve()">เสิร์ฟไอศกรีม 🍨</button><p class="message" id="message" aria-live="polite"></p></section></div>
<section id="end" class="panel hidden"><div class="face">🏆</div><h2>หมดเวลาแล้ว!</h2><p id="result"></p><button class="action" onclick="startGame()">เล่นอีกครั้ง 🔁</button></section><p class="small">เล่นได้ทั้งโทรศัพท์และแท็บเล็ต • ไม่ต้องติดตั้งแอป</p></main>
<script>
const F=[{n:'วานิลลา',e:'🍦'},{n:'สตรอว์เบอร์รี',e:'🍓'},{n:'ช็อกโกแลต',e:'🍫'},{n:'มิ้นต์',e:'🍃'}],T=[{n:'เกล็ดน้ำตาล',e:'🌈'},{n:'เชอร์รี',e:'🍒'},{n:'คุกกี้',e:'🍪'},{n:'ไม่ใส่',e:'✨'}],faces=['👧','👦','👩','👨','👵','🧒'];let flavor=-1,top=-1,orderF=0,orderT=0,coins=0,served=0,remaining=90,timer=null,playing=false;
const $=id=>document.getElementById(id);
function build(id,items,kind){$(id).innerHTML=items.map((x,i)=>'<button data-i="'+i+'" onclick="pick(\''+kind+'\','+i+')">'+x.e+' '+x.n+'</button>').join('')}
function pick(kind,i){if(!playing)return;if(kind==='f')flavor=i;else top=i;document.querySelectorAll('#'+(kind==='f'?'flavors':'toppings')+' button').forEach((b,j)=>b.classList.toggle('selected',i===j));$('preview').textContent=(flavor<0?'🍦':F[flavor].e)+' '+(top<0?'':T[top].e)}
function newOrder(){orderF=Math.floor(Math.random()*F.length);orderT=Math.floor(Math.random()*T.length);$('face').textContent=faces[Math.floor(Math.random()*faces.length)];$('order').textContent='ขอรส'+F[orderF].n+' + '+T[orderT].n+' หน่อยค่ะ!';flavor=-1;top=-1;$('preview').textContent='🍦';document.querySelectorAll('.choices button').forEach(b=>b.classList.remove('selected'))}
function stats(){$('coins').textContent=coins+' 🪙';$('served').textContent=served;$('time').textContent=remaining}
function startGame(){clearInterval(timer);coins=0;served=0;remaining=90;playing=true;$('start').classList.add('hidden');$('end').classList.add('hidden');$('play').classList.remove('hidden');$('message').textContent='';build('flavors',F,'f');build('toppings',T,'t');newOrder();stats();timer=setInterval(()=>{remaining--;stats();if(remaining<=0)finish()},1000)}
function serve(){if(!playing)return;if(flavor<0||top<0){$('message').textContent='เลือกทั้งรสชาติและท็อปปิงก่อนนะ 😊';return}if(flavor===orderF&&top===orderT){coins+=10;served++;$('message').textContent='ถูกต้อง! ได้ 10 เหรียญ 🎉';newOrder()}else{$('message').textContent='ยังไม่ตรงออร์เดอร์ ลองใหม่อีกครั้ง 💕'}stats()}
function finish(){playing=false;clearInterval(timer);$('play').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent='เสิร์ฟสำเร็จ '+served+' ถ้วย ได้ '+coins+' เหรียญ!'}
</script></body></html>
